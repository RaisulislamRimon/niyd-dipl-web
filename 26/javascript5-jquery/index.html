<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Bootstrap’s CSS  -->
    <link rel="stylesheet" href="bootstrap.min.css" />
    <!-- css -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="my-5">
      <div class="container">
        <div class="row">
          <!-- 1st column  -->
          <div class="col-md-12">
            <div class="card card-body">
              <div class="">
                <img
                  src="img/1.jpg"
                  alt="image-1"
                  class="image-fluid"
                  style="height: 600px"
                  id="mainImage"
                />
              </div>

              <!-- small icon  -->
              <div class="mt-4 mx-auto">
                <img
                  class="sub-image"
                  src="img/1.jpg"
                  alt="sub-image-1"
                  style="height: 100px; width: 100px; margin-right: 10px"
                  id="subImage1"
                />
                <img
                  class="sub-image"
                  src="img/2.jpg"
                  alt="sub-image-2"
                  style="height: 100px; width: 100px; margin-right: 10px"
                  id="subImage2"
                />
                <img
                  class="sub-image"
                  src="img/3.jpg"
                  alt="sub-image-3"
                  style="height: 100px; width: 100px; margin-right: 10px"
                  id="subImage3"
                />
                <img
                  class="sub-image"
                  src="img/4.jpg"
                  alt="sub-image-4"
                  style="height: 100px; width: 100px; margin-right: 10px"
                  id="subImage4"
                />
              </div>

              <!-- <img
                src="img/2.jpg"
                alt="image-2"
                class="img-fluid d-none"
                style="height: 600px"
              />
              <img
                src="img/3.jpg"
                alt="image-3"
                class="img-fluid d-none"
                style="height: 600px"
              />
              <img
                src="img/4.jpg"
                alt="image-4"
                class="img-fluid d-none"
                style="height: 600px"
              /> -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap’s JS -->
    <script src="bootstrap.bundle.min.js"></script>
    <!-- jquery  -->
    <script src="jquery-4.0.0.min.js"></script>
    <!-- javascript  -->
    <script src="script.js"></script>
  </body>
</html>
