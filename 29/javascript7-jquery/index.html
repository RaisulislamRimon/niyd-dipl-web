<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- Bootstrap css cdn  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- form section  -->
    <section class="py-5 bg-light">
      <div class="container">
        <div class="row">
          <div class="col-md-8 mx-auto">
            <div class="card">
              <!-- card-header  -->
              <div class="card-header">Form Validation</div>
              <!-- card-body  -->
              <div class="card-body">
                <!-- form  -->
                <form action="" method="POST" id="registrationForm">
                  <!-- name  -->
                  <div class="row mb-3">
                    <label class="col-md-3">Name</label>
                    <div class="col-md-9">
                      <input
                        type="text"
                        class="form-control"
                        name="name"
                        id="name"
                      />
                    </div>
                  </div>
                  <!-- email  -->
                  <div class="row mb-3">
                    <label class="col-md-3"> Email </label>
                    <div class="col-md-9">
                      <input
                        type="email"
                        class="form-control"
                        name="email"
                        id="email"
                      />
                    </div>
                  </div>
                  <!-- mobile  -->
                  <div class="row mb-3">
                    <label class="col-md-3"> Mobile </label>
                    <div class="col-md-9">
                      <input
                        type="number"
                        class="form-control"
                        name="mobile"
                        id="mobile"
                      />
                    </div>
                  </div>
                  <!-- password  -->
                  <div class="row mb-3">
                    <label class="col-md-3"> Password </label>
                    <div class="col-md-9">
                      <input
                        type="password"
                        class="form-control"
                        name="password"
                        id="password"
                      />
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="container">
      <h1 id="heading">This is heading</h1>
      <input
        type="text"
        name="name"
        id="nameInput"
        placeholder="Enter your name"
      />
      <!-- <button id="greetButton" onmouseover="changeHeadingBgReg()">Greet</button> -->
      <button id="greetButton">Greet</button>
      <p id="greetP"></p>

      <!-- table  -->

      <table border="1">
        <!-- 1st row  -->
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Full Name</th>
        </tr>

        <!-- 2nd row  -->
        <tr>
          <td>
            <input
              type="text"
              name="firstName"
              id="firstName"
              placeholder="First Name"
            />
          </td>
          <td>
            <input
              type="text"
              name="lastName"
              id="lastName"
              placeholder="Last Name"
            />
          </td>
          <td>
            <!-- empty -->
          </td>
        </tr>

        <!-- 3rd row  -->
        <tr>
          <td id="firstNameValue" height="50"></td>
          <td id="lastNameValue"></td>
          <td id="fullNameValue"></td>
        </tr>
      </table>

      <hr />

      <!-- heading 2 content -->
      <h2 id="headingTwo">heading 2 content</h2>
      <button type="button" id="headingTwoButton">Click Me</button>

      <br />
      <br />

      <hr />
    </section>

    <!-- Bootstrap js cdn  -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
