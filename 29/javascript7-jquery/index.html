<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1 id="heading">This is heading</h1>
    <input
      type="text"
      name="name"
      id="nameInput"
      placeholder="Enter your name"
    />
    <!-- <button id="greetButton" onmouseover="changeHeadingBgReg()">Greet</button> -->
    <button id="greetButton">Greet</button>
    <p id="greetP"></p>

    <!-- table  -->

    <table border="1">
      <!-- 1st row  -->
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Full Name</th>
      </tr>

      <!-- 2nd row  -->
      <tr>
        <td>
          <input
            type="text"
            name="firstName"
            id="firstName"
            placeholder="First Name"
          />
        </td>
        <td>
          <input
            type="text"
            name="lastName"
            id="lastName"
            placeholder="Last Name"
          />
        </td>
        <td>
          <!-- empty -->
        </td>
      </tr>

      <!-- 3rd row  -->
      <tr>
        <td id="firstNameValue" height="50"></td>
        <td id="lastNameValue"></td>
        <td id="fullNameValue"></td>
      </tr>
    </table>

    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
