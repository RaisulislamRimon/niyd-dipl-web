<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>Javascript - JQuery</h1>

    <!-- container div  -->
    <div id="container">
      <!-- nothing here  -->
    </div>

    <!-- table  -->
    <table>
      <!-- height  -->
      <tr>
        <th>Enter Height</th>
        <td><input type="number" name="" id="heightInput" /></td>
      </tr>
      <!-- width  -->
      <tr>
        <th>Enter Weight</th>
        <td><input type="number" name="" id="weightInput" /></td>
      </tr>
      <!-- bg-color  -->
      <tr>
        <th>Enter Background Color</th>
        <td>
          <input type="color" name="" id="bgColorInput" />
        </td>
      </tr>
      <!-- create div button  -->
      <tr>
        <th></th>
        <td>
          <input type="button" value="Create Div" onclick="createDiv()" />
        </td>
      </tr>
    </table>

    <script src="js/script.js"></script>
  </body>
</html>
