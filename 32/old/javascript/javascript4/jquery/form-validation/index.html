<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JQuery - Form Validation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>JQuery - Form Validation</h1>

    <div class="reg-form">
      <form action="" id="regForm">
        <!-- firstName -->
        <div>
          <label for="firstName">First Name <span>*</span> </label>
          <input type="text" name="firstName" id="firstName" />
          <span id="firstNameError"></span>
        </div>

        <!-- lastName -->
        <div>
          <label for="lastName">Last Name <span>*</span> </label>
          <input type="text" name="lastName" id="lastName" />
          <span id="lastNameError"></span>
        </div>

        <!-- userName -->
        <div>
          <label for="userName">User Name <span>*</span> </label>
          <input type="text" name="userName" id="userName" />
          <span id="userNameError"></span>
        </div>

        <!-- email -->
        <div>
          <label for="email"> Email <span>*</span> </label>
          <input type="email" name="email" id="email" />
          <span id="emailError"></span>
        </div>

        <!-- password -->
        <div>
          <label for="password"> Password <span>*</span> </label>
          <input type="password" name="password" id="password" />
          <span id="passwordError"></span>
        </div>

        <!-- confirmPassword -->
        <div>
          <label for="confirmPassword">Confirm Password <span>*</span> </label>
          <input type="text" name="confirmPassword" id="confirmPassword" />
          <span id="confirmPasswordError"></span>
        </div>

        <!-- phone -->
        <div>
          <label for="phone"> Phone <span>*</span> </label>
          <input type="text" name="phone" id="phone" />
          <span id="phoneError"></span>
        </div>

        <!-- Date of Birth -->
        <div>
          <label for="dateOfBirth"> Date Of Birth <span>*</span> </label>
          <input type="date" name="dateOfBirth" id="dateOfBirth" />
          <span id="dateOfBirthError"></span>
        </div>

        <!-- Gender -->
        <div>
          <label for="gender"> Gender <span>*</span> </label>
          <input type="radio" name="gender" class="gender" />Male
          <input type="radio" name="gender" class="gender" />Female
          <span id="genderError"></span>
        </div>

        <!-- country -->
        <div>
          <label for="country"> Country <span>*</span> </label>
          <select name="country" id="country">
            <option>Select a country</option>
            <option value="bd">Bangladesh</option>
            <option value="bidesh">Bidesh</option>
          </select>
        </div>

        <!-- submit/registration button -->
        <div>
          <label for=""></label>
          <input type="submit" id="regBtn" value="Submit" />
        </div>
      </form>
    </div>

    <script src="jquery-4.0.0.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
