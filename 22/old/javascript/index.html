  <body>
    <h1 id="helloWorld">Hello World</h1>

    <h1 onclick="alert('HI')">Click here</h1>

    <script>
      // console.log("Hello World!");
      // document.write("Hi World! <br>");
      // document.write("Hello World¬!");
      // alert("Hi¬");

      var firstName = "First Name";
      var lastName = "Last Name";

      var firstName1 = "<h1 class=''>Hi, First Name</h1>";

      document.write(firstName1);

      document.write(firstName);
      document.write(lastName);

      document.write("<br>");

      document.write(firstName + " " + lastName);

      // operator

      // // arithmetic operator
      //   binary + - * / %
      //   unary ++ -- (-)
      // assignment operator = += -= *= /= %=
      // conditional operator > >= < <= == === != !==

      document.write("<br>");

      var firstNumber = 20;
      var lastNumber = 10;

      document.write(firstNumber + lastNumber + "<br>");
      document.write(firstNumber - lastNumber + "<br>");
      document.write(firstNumber * lastNumber + "<br>");
      document.write(firstNumber / lastNumber + "<br>");
      document.write((firstNumber % lastNumber) + "<br>");

      var firstNum = 23;
      var lastNum = 10;

      document.write(firstNum + "<br>");
      document.write(++firstNum + "<br>");
      document.write(firstNum++ + "<br>");
      document.write(firstNum + "<br>");

      document.write("<hr>");

      var firstNum = 23;
      var lastNum = 10;

      document.write(++firstNum + "<br>");
      // document.write(firstNum + "<br>");
      document.write(++firstNum + "<br>");
      document.write(firstNum++ + "<br>");
      // document.write(firstNum + "<br>");

      document.write("<hr>");

      var firstNum = 23;
      var lastNum = 10;

      document.write(firstNum-- + "<br>");
      // document.write(firstNum + "<br>");
      document.write(firstNum-- + "<br>");
      document.write(--firstNum + "<br>");
      document.write(firstNum-- + "<br>");
      // document.write(firstNum + "<br>");

      document.write("<hr>");

      var firstNum = 23;
      var lastNum = 10;

      document.write(firstNum-- + "<br>");
      document.write(firstNum++ + "<br>");
      document.write(++firstNum + "<br>");
      document.write(firstNum-- + "<br>");
      document.write(++firstNum + "<br>");
      document.write(firstNum-- + "<br>");
      // document.write(--firstNum + "<br>");
      // document.write(firstNum + "<br>");

      document.write("<hr>");

      var firstNum = 23;
      var lastNum = 10;

      document.write((firstNum += lastNum));

      document.write("<hr>");

      document.write("<hr>");

      var firstNum = 23;
      var lastNum = 10;

      document.write((firstNum += lastNum) + "<br>");
      document.write((firstNum -= lastNum) + "<br>");
      document.write((firstNum *= lastNum) + "<br>");
      document.write((firstNum /= lastNum) + "<br>");
      document.write((firstNum %= lastNum) + "<br>");

      document.write("<hr>");

      var firstNum = 23;
      var lastNum = 10;
      document.write(firstNum > lastNum);

      document.write("<hr>");

      var firstNum = 23;
      var lastNum = 10;
      document.write(firstNum < lastNum);

      document.write("<hr>");

      var firstNum = 23;
      var lastNum = 10;
      document.write(firstNum >= lastNum + "<br>");
      document.write(firstNum <= lastNum + "<br>");
      document.write(firstNum == lastNum + "<br>");
      document.write(firstNum === lastNum + "<br>");

      document.write("<hr>");
    </script>
