<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Day 1</title>
    <!-- bootstrap css  -->
    <link rel="stylesheet" href="css/bootstrap.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="row">
          <div
            class="col-xxl-3 col-xl-3 col-lg-3 col-md-4 col-sm-4 bg-success py-5"
          >
            Logo
          </div>
          <div
            class="col-xxl-9 col-xl-9 col-lg-9 col-md-8 col-sm-8 bg-danger py-5"
          >
            Banner
          </div>
        </div>
      </div>
    </header>

    <hr />

    <div>
      <div class="container">
        <div class="row">
          <div class="col bg-success py-5"></div>
          <div class="col bg-danger py-5"></div>
          <div class="col bg-info py-5"></div>
          <div class="col bg-primary py-5"></div>
          <div class="col bg-warning py-5"></div>
        </div>
      </div>
    </div>

    <hr />

    <div>
      <div class="container">
        <div class="row">
          <div class="col-xxl bg-success py-5"></div>
          <div class="col-xxl bg-danger py-5"></div>
          <div class="col-xxl bg-info py-5"></div>
          <div class="col-xxl bg-primary py-5"></div>
          <div class="col-xxl bg-warning py-5"></div>
        </div>
      </div>
    </div>

    <hr />

    <div>
      <div class="container">
        <div class="row">
          <div class="col-xl bg-success py-5"></div>
          <div class="col-xl bg-danger py-5"></div>
          <div class="col-xl bg-info py-5"></div>
          <div class="col-xl bg-primary py-5"></div>
          <div class="col-xl bg-warning py-5"></div>
        </div>
      </div>
    </div>

    <hr />

    <div>
      <div class="container">
        <div class="row">
          <div class="col col-md-4 bg-success py-5"></div>
          <div class="col col-md-4 bg-danger py-5"></div>
          <div class="col col-md-4 bg-info py-5"></div>
          <div class="col col-md-6 bg-primary py-5"></div>
          <div class="col col-md-6 bg-warning py-5"></div>
        </div>
      </div>
    </div>

    <hr />

    <div>
      <div class="container">
        <div class="row">
          <div class="col-lg col-md-4 bg-success py-5"></div>
          <div class="col-lg col-md-4 bg-danger py-5"></div>
          <div class="col-lg col-md-4 bg-info py-5"></div>
          <div class="col-lg col-md-6 bg-primary py-5"></div>
          <div class="col-lg col-md-6 bg-warning py-5"></div>
        </div>
      </div>
    </div>

    <!-- bootstrap js  -->
    <script src="js/bootstrap.bundle.js"></script>
  </body>
</html>
