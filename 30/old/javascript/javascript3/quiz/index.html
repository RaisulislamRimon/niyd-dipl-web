<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="quiz-container">
      <h1>Perfect plant match</h1>

      <form action="" id="plantQuiz">
        <label for=""> sunlight </label>
        <select name="" id="sunlight">
          <option value="low">Low light</option>
          <option value="medium">Medium light</option>
          <option value="high">High light</option>
        </select>

        <label for=""> care </label>
        <select name="" id="care">
          <option value="easy">Low</option>
          <option value="moderate">Medium</option>
          <option value="high">High</option>
        </select>

        <label for=""> pet-friendly </label>
        <select name="" id="pets">
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>

        <button type="submit">Find my perfect plant</button>
      </form>

      <div id="result" class="result-box"></div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
