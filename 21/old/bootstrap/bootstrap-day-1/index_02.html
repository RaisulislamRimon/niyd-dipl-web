<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Day 1</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/bootstrap.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <!-- Brand -->
        <a href="#" class="navbar-brand"> My Website </a>
        <!-- Mobile Toggle Button -->
        <button
          type="button"
          class="navbar-toggler"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
          aria-controls="menu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <!-- Navbar Menu -->
        <div class="collapse navbar-collapse" id="menu">
          <!-- Main Menu -->
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="#" class="nav-link">About</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Portfolio</a></li>
            <!-- Service Dropdown -->
            <li class="nav-item dropdown">
              <a
                href="#"
                class="nav-link dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Service
              </a>
              <ul class="dropdown-menu">
                <li><a href="#" class="dropdown-item">Service One</a></li>
                <li><a href="#" class="dropdown-item">Service Two</a></li>
                <li><a href="#" class="dropdown-item">Service Three</a></li>
              </ul>
            </li>
            <li class="nav-item"><a href="#" class="nav-link">Gallery</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
          </ul>
          <!-- Login / Signup -->
          <ul class="navbar-nav">
            <li class="nav-item"><a href="#" class="nav-link">Login</a></li>
            <li class="nav-item"><a href="#" class="nav-link">Signup</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="carousel slide" data-bs-ride="carousel" data-bs-interval="1800">
      <!-- standard time : 1800 - 2200 -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="img/slider-1.jpg"
            alt="slider-1"
            class="w-100"
            height="600"
          />
        </div>
        <div class="carousel-item">
          <img
            src="img/slider-2.jpg"
            alt="slider-2"
            class="w-100"
            height="600"
          />
        </div>
        <div class="carousel-item">
          <img
            src="img/slider-3.jpg"
            alt="slider-3"
            class="w-100"
            height="600"
          />
        </div>
        <div class="carousel-item">
          <img
            src="img/slider-4.jpg"
            alt="slider-4"
            class="w-100"
            height="600"
          />
        </div>
        <div class="carousel-item">
          <img
            src="img/slider-5.jpg"
            alt="slider-5"
            class="w-100"
            height="600"
          />
        </div>
        <div class="carousel-item">
          <img
            src="img/slider-6.jpg"
            alt="slider-6"
            class="w-100"
            height="600"
          />
        </div>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="js/bootstrap.bundle.js"></script>
  </body>
</html>
