<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JQuery</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1 id="demo">JQuery</h1>
    <h2 id="demo2">Demo2</h2>
    <h3 id="demo3">Demo3</h3>
    <h4 id="demo4">Demo4</h4>

    <div class="calculator">
      <input type="number" id="firstNumber" placeholder="enter first number" />

      <input
        type="number"
        id="secondNumber"
        placeholder="enter second number"
      />

      <button id="sum">+</button>
      <button id="sub">-</button>
      <button id="multi">*</button>
      <button id="dev">/</button>

      <input type="number" id="result" />
    </div>

    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
